<svg width="550" height="200" viewBox="0 0 550 200"
     xmlns="http://www.w3.org/2000/svg" class="prox-logo"
     text-rendering="geometricPrecision" shape-rendering="geometricPrecision">

  <defs>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff3b3b"/>
      <stop offset="35%" stop-color="#ff00ff"/>
      <stop offset="70%" stop-color="#4a3bff"/>
      <stop offset="100%" stop-color="#00e1ff"/>
    </linearGradient>

    <style>
      .ring{ fill:none; stroke:url(#ringGrad); stroke-width:3; }

      .r1{ transform-origin:100px 100px; animation:r1 10s linear infinite; }
      @keyframes r1{ from{transform:rotateY(0);} to{transform:rotateY(360deg);} }

      .r2{ transform-origin:100px 100px; animation:r2 11s linear infinite; }
      @keyframes r2{ from{transform:rotateX(0);} to{transform:rotateX(360deg);} }

      .r3{ transform-origin:100px 100px; animation:r3 12.5s linear infinite; }
      @keyframes r3{ from{transform:rotateY(0);} to{transform:rotateY(-360deg);} }

      .r4{ transform-origin:100px 100px; animation:r4 11.5s linear infinite; }
      @keyframes r4{ from{transform:rotateX(0);} to{transform:rotateX(-360deg);} }

      .txt{
        font-family: Arial Black, sans-serif;
        font-size: 42px;
        fill:white;
        text-rendering: geometricPrecision;
        shape-rendering: crispEdges;
        paint-order: stroke fill;
      }
    </style>
  </defs>

  <circle class="ring r1" cx="100" cy="100" r="70"/>
  <circle class="ring r2" cx="100" cy="100" r="56"/>
  <circle class="ring r3" cx="100" cy="100" r="44"/>
  <circle class="ring r4" cx="100" cy="100" r="32"/>

  <text x="180" y="110" class="txt">PROXERATECH</text>
</svg>
