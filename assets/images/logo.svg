<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="g" x1="0" x2="1">
<stop offset="0" stop-color="#ff6a3d"/>
<stop offset="1" stop-color="#9a00ff"/>
</linearGradient>
<style>
@keyframes rot{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.ring{fill:none;stroke:url(#g);stroke-width:10;transform-origin:150px 150px;animation:rot 10s linear infinite;}
.p{fill:url(#g);}
</style>
</defs>
<circle class="ring" cx="150" cy="150" r="110"/>
<circle class="ring" cx="150" cy="150" r="140" style="animation-duration:16s;animation-direction:reverse"/>
<path class="p" d="M80 200 Q80 120 160 120 L200 120 Q200 200 120 200 Z"/>
</svg>